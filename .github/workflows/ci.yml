name: CI

on:
  push:
    branches: [main, master, feat/**]
  pull_request:

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Test contracts
        run: cargo test --workspace

  build:
    name: stellar contract build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - name: Install stellar-cli
        run: |
          curl -sL -o /tmp/stellar.tar.gz \
            https://github.com/stellar/stellar-cli/releases/download/v30.0.1/stellar-cli-30.0.1-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/stellar.tar.gz -C /tmp
          sudo install -m 755 /tmp/stellar /usr/local/bin/stellar
          stellar version
      - name: Build optimized contracts
        run: |
          stellar contract build --package attestation-registry
          stellar contract build --package trade-credit-pool
          stellar contract build --package receivable-allocator || true
          stellar contract build --package payout-router || true
          stellar contract build --package protocol-controller || true
          stellar contract build --package receivable-token || true
          stellar contract build --package fist-multisig || true
