# Soroban-adapted entities aligned with fist-commerce-subgraph names.
# Addresses are String (G… / C…) instead of Bytes.
# Served by FistCommerceStellar direct RPC indexer — not The Graph / SubQuery.

type Deposit {
  id: ID!
  user: String!
  amount: String!
  blockNumber: String!
  blockTimestamp: String!
  transactionHash: String!
}

type Withdrawal {
  id: ID!
  user: String!
  amount: String!
  blockNumber: String!
  blockTimestamp: String!
  transactionHash: String!
}

type ReceivableFunded {
  id: ID!
  receivableId: String!
  blockNumber: String!
  blockTimestamp: String!
  transactionHash: String!
}

type PaymentRecorded {
  id: ID!
  receivableId: String!
  payment: String!
  blockNumber: String!
  blockTimestamp: String!
  transactionHash: String!
}

type AttestationIssued {
  id: ID!
  subjectId: String!
  attestationType: String!
  issuer: String!
  blockTimestamp: String!
  transactionHash: String!
}

type AttestationRevoked {
  id: ID!
  subjectId: String!
  attestationType: String!
  blockTimestamp: String!
  transactionHash: String!
}

type Query {
  deposits(first: Int = 100, skip: Int = 0): [Deposit!]!
  withdrawals(first: Int = 100, skip: Int = 0): [Withdrawal!]!
  receivableFundeds(first: Int = 100, skip: Int = 0): [ReceivableFunded!]!
  paymentRecordeds(first: Int = 100, skip: Int = 0): [PaymentRecorded!]!
  attestationIssueds(first: Int = 100, skip: Int = 0): [AttestationIssued!]!
}
