[workspace]
resolver = "2"
members = [
    "contracts/attestation-registry",
    "contracts/trade-credit-pool",
    # Track B (added in later commits):
    # "contracts/receivable-allocator",
    # "contracts/payout-router",
    # "contracts/protocol-controller",
    # "contracts/receivable-token",
    # "contracts/fist-multisig",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/fist-commerce/fist-commerce-stellar"
authors = ["Fist Commerce"]

[workspace.dependencies]
soroban-sdk = "29.0.1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
